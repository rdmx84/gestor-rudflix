<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
      padding: 24px;
      text-align: center;
    }
    .box {
      max-width: 340px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #475569; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: #3f54a6;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Você está offline</h1>
    <p>Não foi possível carregar Gestor Rudflix. Verifique sua conexão com a internet e tente novamente.</p>
    <button onclick="window.location.href='https://gestorv3.org/rudflix/control/home'">Tentar novamente</button>
  </div>
</body>
</html>
